name: 리포트 드롭 대시보드 적재

on:
  # 2026-10-11: 드롭 파일이 push되면 바로 적재한다(주간 스캔 예약이 월 10:00이라 고정 시각으로는 못 맞춘다).
  # 시각 실행은 push 트리거가 빠졌을 때의 백업. 재적재는 URL ignore-duplicates라 중복이 생기지 않는다.
  push:
    branches: [master, main]
    paths: ['drops/**']
  schedule:
    - cron: '17 4 * * 1'  # 매주 월요일 13:17 KST (04:17 UTC) 백업 - 정시(:00) 고부하 슬롯 회피
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 발송 로직은 scripts/send_report_drop.py 공용 모듈 (백업 감시 워크플로와 공유).
      # 과거 YAML 인라인 heredoc 들여쓰기로 파일이 깨져 startup_failure가 났던 이력 →
      # 로직을 스크립트로 분리해 구조적으로 재발 차단 (2026-06-15).
      - name: Load latest drop to dashboard (Discord 전송은 2026-10-11 폐지)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}       # 드롭 신규 리포트를 대시보드 뉴스룸 탭에도 적재
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/send_report_drop.py
